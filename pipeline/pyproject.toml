[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trendin-pipeline"
version = "0.1.0"
description = "TrendIn Airflow 파이프라인 — 패션·개발 트렌드 수집·분석"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 버전은 Airflow constraints 가 고정한다 (Dockerfile · scripts/dev-setup.sh). 여기엔 이름만 적는다.
dependencies = [
  "apache-airflow[statsd]==3.3.1",
  "apache-airflow-providers-standard",
  "apache-airflow-providers-postgres",
  "httpx",
  # 수집 계층 저장소 클라이언트. Airflow 훅이 아니라 순수 클라이언트를 쓴다 —
  # 태스크 함수는 airflow 를 import 하지 않는다(README 규약 12, S15P21A102-167).
  "boto3",             # MinIO. S3 호환이라 endpoint_url 만 바꾸면 실제 S3 로도 간다
  "confluent-kafka",   # 발급
  # 한국어 형태소 분석기 (spark/docs/04 §2, src/trendin/spark/extract/morphology.py).
  # C++ 확장이라 JVM·torch 가 없고 Windows·Linux 휠이 둘 다 있다 — 호스트 층 1 테스트와
  # 컨테이너 Job 이 같은 코드로 돈다. 모델이 약 110 MB 라 이미지가 그만큼 커진다.
  "kiwipiepy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  # 마이너를 막는다. ruff 는 마이너마다 규칙이 늘어서, 고정하지 않으면 아무도 코드를
  # 안 고쳤는데 CI 린트가 빨개진다. 올릴 때는 이 줄을 고치고 걸린 것을 한 번에 고친다.
  "ruff>=0.16.5,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# spark/tests 는 층 1(순수 함수) · 층 2(local[2] 세션) · 층 3(compose) 로 나뉜다.
# 층 3 은 아직 비어 있다 (spark/docs/09-dev-and-test.md 4절 — 그 문서는 저장소에 없다).
# pyspark 는 여기에 없다 — 버전 핀은 spark/versions.sh 한 곳이고, 설치는
# spark/scripts/dev-setup.sh(로컬) 와 spark/Dockerfile(컨테이너) 이 한다.
testpaths = ["tests", "spark/tests"]
addopts = "-q"
markers = [
  "allow_network: 명시적인 외부 연동 테스트에서만 실제 HTTP 요청을 허용",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["logs", "spark/jars"]

[tool.ruff.lint]
# AIR: Airflow 3 마이그레이션 규칙(깨진 import 탐지). E/F/I: 기본 오류·미사용·import 정렬.
select = ["E", "F", "I", "AIR"]
