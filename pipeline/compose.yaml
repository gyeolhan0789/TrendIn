# TrendIn 파이프라인 — Airflow 3.3.1 · LocalExecutor.
# 공식 docker-compose.yaml(3.3.1) 에서 Celery · Redis · worker · flower · triggerer 를 뺀 형태다.
# 결정 근거: Jira S15P21A102-146 · 설계 문서 airflow-skeleton.md (작성자 보관)
name: s15p21a102-pipeline

x-airflow-common:
  &airflow-common
  build:
    context: .
  image: s15p21a102/pipeline:local
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in pipeline/.env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # 로컬 기본값: 로그인 없이 전원 admin. UI 포트는 127.0.0.1 에만 열린다.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in pipeline/.env}
    # 첫 실행 전에 고정. 나중에 바꾸면 한 회차를 건너뛴다 (Airflow 3.0 RELEASE_NOTES).
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # 앱 DB 접속. 배포 시 .env 의 AIRFLOW_CONN_APP_DB 만 팀 postgres(forever102) 로 바꾼다.
    AIRFLOW_CONN_APP_DB: ${AIRFLOW_CONN_APP_DB:-postgres://trendin:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in pipeline/.env}@postgres:5432/trendin}
    # 수집 계층 접속 정보. 크롤러 태스크가 이 값으로 MinIO 에 올리고 Kafka 에 발행한다.
    # 저장소는 datastore/compose.yaml 이 띄운다. 값의 출처는 pipeline/.env 다.
    TRENDIN_KAFKA_BOOTSTRAP: ${TRENDIN_KAFKA_BOOTSTRAP:-kafka:9092}
    TRENDIN_KAFKA_TOPIC_RAW_FILE_READY: ${TRENDIN_KAFKA_TOPIC_RAW_FILE_READY:-raw-file-ready}
    TRENDIN_MINIO_ENDPOINT: ${TRENDIN_MINIO_ENDPOINT:-http://minio:9000}
    TRENDIN_MINIO_BUCKET: ${TRENDIN_MINIO_BUCKET:-raw-data}
    TRENDIN_MINIO_ACCESS_KEY: ${TRENDIN_MINIO_ACCESS_KEY:?Set TRENDIN_MINIO_ACCESS_KEY in pipeline/.env}
    TRENDIN_MINIO_SECRET_KEY: ${TRENDIN_MINIO_SECRET_KEY:?Set TRENDIN_MINIO_SECRET_KEY in pipeline/.env}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./pools.json:/opt/airflow/pools.json:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - default
    - data
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in pipeline/.env}
      POSTGRES_DB: airflow
      # 앱 DB 는 docker/postgres-init 스크립트가 빈 볼륨 초기화 때 한 번 만든다.
      APP_DB_NAME: trendin
      APP_DB_USER: trendin
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in pipeline/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # 호스트 포트는 열지 않는다. 컨테이너 사이 통신만.

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # 한 번 돌고 끝난다: 메타 DB 마이그레이션(_AIRFLOW_DB_MIGRATE) → pool 등록.
  airflow-init:
    <<: *airflow-common
    command: ["airflow", "pools", "import", "/opt/airflow/pools.json"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'

  # 일회성 CLI: docker compose run --rm airflow-cli airflow dags list
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres-data:
    name: s15p21a102-pipeline-postgres-data

networks:
  # datastore/compose.yaml 이 만드는 네트워크. 저장소를 먼저 띄워야 이 프로젝트가 뜬다.
  # Airflow 태스크가 여기로 kafka · minio 에 서비스 이름으로 붙는다.
  data:
    name: s15p21a102-data
    external: true
