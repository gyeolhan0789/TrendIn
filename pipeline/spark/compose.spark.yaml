# 데이터 EC2 배포용 오버레이. pipeline/compose.yaml 위에 얹어 Airflow 를 Spark 가 든
# 이미지로 갈아끼운다. 컨테이너 수는 늘지 않는다.
#
#   docker compose -f datastore/compose.yaml up -d     # Kafka · MinIO. 먼저다
#   cd pipeline
#   spark/scripts/build-image.sh                       # 기본 이미지 → 파생 이미지 (두 단계)
#   docker compose -f compose.yaml -f spark/compose.spark.yaml up -d
#
# --- pipeline/compose.yaml 과 Dockerfile 을 건드리지 않는다 -------------------
# 그 두 파일은 팀 공용이다 (09 §2). 여기서 image · build · volumes · environment 만
# 덮어쓴다. 되돌릴 때는 이 -f 를 빼면 끝이다.
#
# --- 왜 Airflow 서비스 전부인가 ----------------------------------------------
# 태스크가 실제로 도는 곳은 LocalExecutor 라 scheduler 하나다. 그런데 Airflow 는 모든
# 구성요소가 같은 이미지를 쓰는 것을 전제로 만들어져 있어서, 하나만 다른 이미지로 두면
# 나중에 provider·plugin 이 어긋날 때 원인을 찾기 어려워진다. 파생 이미지는 기본 이미지의
# 상위집합이고 추가 빌드도 없으므로 전부 같은 것을 준다.
#
# --- 로컬 개발과의 관계 ------------------------------------------------------
# 로컬에서 호스트 .venv 로 돌릴 때는 이 파일이 아니라 spark/compose.dev.yaml 을 쓴다.
# 둘을 같이 얹지 않는다 — 같은 것을 두 경로로 하게 된다.

x-spark-airflow: &spark-airflow
  image: s15p21a102/pipeline-spark:local
  build:
    context: ./spark
    dockerfile: Dockerfile
    args:
      PIPELINE_IMAGE: s15p21a102/pipeline:local
  volumes:
    # jobs · conf · jars · sql. 코드를 고치면 재빌드 없이 다음 실행에 반영된다
    # (./src · ./dags 를 마운트하는 것과 같은 이유 — pipeline/README.md "코드 반영").
    - ./spark:/opt/airflow/spark
    # checkpoint 는 컨테이너와 함께 사라지면 안 된다. 지우면 Kafka 를 처음부터 다시 읽는다.
    # 지우는 것은 [02 §6] 의 재처리 절차를 따를 때만 한다.
    - spark-checkpoints:/opt/airflow/checkpoints
  environment:
    # 컨테이너 안이므로 주소가 서비스 이름이다. 호스트 포트가 필요 없다.
    SPARK_JOB_PROFILE: ${SPARK_JOB_PROFILE:-dev}
    KAFKA_BOOTSTRAP_SERVERS: ${TRENDIN_KAFKA_BOOTSTRAP:-kafka:9092}
    KAFKA_TOPIC_RAW_FILE_READY: ${TRENDIN_KAFKA_TOPIC_RAW_FILE_READY:-raw-file-ready}
    MINIO_ENDPOINT: ${TRENDIN_MINIO_ENDPOINT:-http://minio:9000}
    # 크롤러 키(TRENDIN_MINIO_*)가 아니라 Spark 키다. 권한이 다르다 — datastore/.env 의
    # MINIO_SPARK_* 와 같은 값을 pipeline/.env 에 넣는다.
    MINIO_ACCESS_KEY: ${TRENDIN_MINIO_SPARK_ACCESS_KEY:?Set TRENDIN_MINIO_SPARK_ACCESS_KEY in pipeline/.env}
    MINIO_SECRET_KEY: ${TRENDIN_MINIO_SPARK_SECRET_KEY:?Set TRENDIN_MINIO_SPARK_SECRET_KEY in pipeline/.env}
    MINIO_RAW_BUCKET: ${TRENDIN_MINIO_BUCKET:-raw-data}
    MINIO_CURATED_BUCKET: ${TRENDIN_MINIO_CURATED_BUCKET:-curated}
    # Spark 는 JDBC URL 과 계정을 따로 받는다. Airflow 의 AIRFLOW_CONN_APP_DB(postgres://)
    # 에서 기계적으로 유도할 수 없어서 별도로 준다. 팀 postgres 로 갈 때 이 값만 바꾼다.
    APP_DB_URL: ${SPARK_APP_DB_URL:-jdbc:postgresql://postgres:5432/trendin}
    APP_DB_USER: ${SPARK_APP_DB_USER:-trendin}
    APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in pipeline/.env}
    CHECKPOINT_ROOT: /opt/airflow/checkpoints

services:
  airflow-apiserver:
    <<: *spark-airflow
  airflow-scheduler:
    <<: *spark-airflow
  airflow-dag-processor:
    <<: *spark-airflow
  airflow-init:
    <<: *spark-airflow
  airflow-cli:
    <<: *spark-airflow

volumes:
  spark-checkpoints:
    name: s15p21a102-spark-checkpoints
