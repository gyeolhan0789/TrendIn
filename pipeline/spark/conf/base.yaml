# 모든 프로파일의 바닥. 여기 없는 키는 프로파일 파일에도 없어야 한다 — 병합 결과를
# 읽을 때 이 파일만 보면 전체 형태를 알 수 있어야 한다.
#
# 병합 순서: base.yaml ← {profile}.yaml ← 환경변수 (09 §3).
# 비밀(비밀번호·시크릿 키)은 이 파일 계열에 적지 않는다. 환경변수로만 들어온다.

spark:
  master: "local[*]"
  conf:
    # 기본값 200 은 이 규모에서 순수 오버헤드다 (09 §2). 파티션당 수십 건짜리
    # 태스크 200 개를 만드는 데 계산보다 스케줄링에 시간이 더 든다.
    spark.sql.shuffle.partitions: 8
    # 내부 계산은 UTC 로 한다. 화면에 보이는 시각 변환은 백엔드가 한다.
    spark.sql.session.timeZone: "UTC"
    # 파티션 덮어쓰기를 쓸 때 건드리지 않은 파티션이 지워지지 않게 한다 ([01 §4] 중복 차단 3).
    spark.sql.sources.partitionOverwriteMode: "dynamic"

logging:
  level: "INFO"        # 파이썬 쪽
  spark_level: "WARN"  # JVM 쪽. INFO 로 두면 로그가 사람 눈으로 못 읽을 양이 된다

kafka:
  bootstrap_servers: ""   # 환경변수 KAFKA_BOOTSTRAP_SERVERS 또는 프로파일이 채운다
  group_id_prefix: "trendin-spark"
  topics:
    raw_file_ready: "raw-file-ready"

minio:
  endpoint: ""      # 비면 S3A 설정을 아예 걸지 않는다
  access_key: ""    # 환경변수 MINIO_ACCESS_KEY
  secret_key: ""    # 환경변수 MINIO_SECRET_KEY
  region: "us-east-1"  # MinIO 는 리전이 없지만 AWS SDK v2 가 값을 요구한다
  buckets:
    raw: "raw-data"      # 담당 1 소유. 읽기만 한다
    curated: "curated"   # Spark 소유 ([01 §3])
  # 그대로 spark.hadoop.* 로 넘어간다. 새 S3A 옵션 때문에 코드를 고치지 않으려고 둔다.
  hadoop_conf: {}

jdbc:
  url: ""       # 환경변수 APP_DB_URL
  user: ""      # 환경변수 APP_DB_USER
  password: ""  # 환경변수 APP_DB_PASSWORD
  driver: "org.postgresql.Driver"
  # 한 번에 보내는 행 수. 측정 전에는 드라이버 기본값을 쓴다.
  batch_size: 1000

checkpoint:
  # Job 마다 하위 디렉터리를 판다 ([01 §4]). 환경변수 CHECKPOINT_ROOT.
  root: ""

# --- Job 별 ---------------------------------------------------------------
# 알고리즘 임계값은 아직 비어 있다. 실제 수집 데이터의 분포를 재기 전에 정한 숫자는
# 전부 다시 정하게 된다 (09 §7 항목 5). 04~07 이 숫자를 명시하지 않은 것도 같은 이유다.

ingest:
  contents:
    # `contents` 테이블이 없으면 시작하지 않는다 ([03 §8]). 없이 돌면 curated 에만 쓰이고
    # 서비스 테이블은 비어, 증상이 [04] 에서야 "관련 콘텐츠가 비어 있다" 로 나타난다.
    # 로컬만 local.yaml 이 false 로 덮고, 그 밖에서는 --allow-missing-contents 로만 푼다.
    required: true
  dlq:
    # DLQ 토픽 이름. 담당 2 가 정하면 채운다 ([02 §5]). 비어 있으면 테이블에만 쓴다.
    # 값이 있는데 토픽 싱크가 없으면 build_dlq_sink 가 경고한다 — 조용히 무시하면
    # "토픽에도 쓰고 있다" 고 믿게 된다.
    topic: ""
  # 정상 완료로 볼지 실패로 볼지가 갈리는 값들. [02] 를 채울 때 함께 정한다.
  thresholds: {}
  # 정제 문턱 (03). **전부 잠정이다** — 실제 수집 데이터의 문서 길이·문자 비율 분포를
  # 재기 전에 정한 숫자라 S6 에서 다시 정하고, 그때 pl_config_history 에 초기값이
  # 기록된다 (09 §7 항목 5). 여기 값을 코드에 박지 않은 이유가 그 재확정이다.
  #
  # 값을 비워두지 않고 잠정값을 적는 이유는 04~07 의 임계값과 사정이 다르기 때문이다.
  # 그쪽은 없으면 Job 이 거부하면 되지만, 정제는 문턱이 없으면 아무 문서도 걸러지지
  # 않고 조용히 전량 통과한다 — 그게 더 나쁘다.
  normalize:
    # 언어 판별 (03 §5). 문자 비율로만 판별하고 판별 라이브러리를 쓰지 않는다.
    lang:
      dominant: 0.6     # 한쪽 문자가 이 비율을 넘으면 그 언어
      secondary: 0.2    # 둘 다 이 비율을 넘으면 mixed
      min_letters: 10   # 글자가 이보다 적으면 unknown
    # 품질 필터 (03 §6). 본문 있는 문서와 없는 문서에 다른 줄이 적용된다.
    filters:
      min_body_len: 100   # 정제 후 본문 길이 하한
      min_title_len: 5    # 제목 길이 하한. 본문 없는 문서가 이것만 본다
    # 근사 중복 (03 §6 3단계). 64비트 SimHash 의 해밍 거리 상한.
    # 낮으면 크로스포스트를 놓치고 높으면 다른 기사를 같은 것으로 묶는데, 후자가 더 나쁘다 —
    # 언급량이 실제보다 줄고 그게 잘못된 하락 판별이 된다 (07 §5).
    #
    # 12 의 근거는 2026-09-08 실측이다 (dedup.DedupThresholds 의 표) — 같은 글을 가볍게
    # 손본 쌍이 8~13, 무관한 글이 31~40 이었다. 두 군집이 13 과 31 사이에서 갈린다.
    # 통상값 3 으로 두면 3단계가 사실상 놀고 있다.
    dedup:
      max_distance: 12

extract:
  # [04] 의 임계값. **`null` 인 키가 하나라도 있으면 Job 이 시작하지 않는다**
  # (`extract/thresholds.py`). 실데이터의 문서 빈도 분포 · 문서 길이를 재기 전에 정한 숫자는
  # 전부 다시 정하게 되고(09 §7 항목 5), 후보 표를 잡음으로 채운 뒤 지우고 다시 돌리는 것보다
  # 시작을 거부하는 것이 싸다. local.yaml 이 S6 측정을 돌릴 잠정값을 채우고, S6 가 확정하면
  # 여기로 옮기며 pl_config_history 에 초기값을 남긴다.
  #
  # 같은 도메인 최근 N 일 문서가 DF · BM25 의 말뭉치다 ([10 §2] 5번 — N 은 미확정).
  corpus_window_days: null
  # 구간 안 n-gram 길이 상한. 4 이상은 거의 항상 문장 조각이다 ([04 §3]).
  ngram_max: 3
  candidate:
    min_chars: 2      # 비교키 문자 수 하한 ([04 §5] 2번)
    max_chars: 40     # 상한. 이보다 길면 문장이다
  # DF 하한·상한 — 절대값이 아니라 **코퍼스 문서 수에 대한 비율** ([04 §5] 5·6번).
  df_min_ratio: null
  df_max_ratio: null
  bm25:
    k1: 1.2           # 통상값. 측정 전에 바꾸지 않는다
    b: 0.75
  # 세 축의 가중합. 축은 문서 안에서 0~1 로 정규화된 뒤 더해진다 ([04 §6]).
  score_weights:
    c_value: null
    bm25: null
    title: null
  # 선별 — 문서당 상위 K 이고 점수 하한 이상 ([04 §7]). 점수는 0~1 척도다.
  per_document_top_k: null
  score_floor: null
  # 불용어 · 노이즈 · 형태소 분석기 사용자 사전 파일. submit.sh 가 pipeline/ 에서 실행하므로
  # 거기 기준 상대 경로다.
  lexicon_dir: "spark/conf/lexicon"
  # [05] 의 문턱 — 정규화·통합·승격. **`null` 인 키가 하나라도 있으면 Job 이 시작하지
  # 않는다** (`registry/thresholds.py`). 위 `extract.*` 와 같은 규약이고 이유도 같다:
  # 승격은 되돌릴 수 없으므로([05 §1]) 근거 없는 문턱으로 서비스 테이블에 행을 넣는 것보다
  # 시작을 거부하는 것이 싸다. 승격 문턱은 후보 분포를 본 뒤라야 정할 수 있어([10 §4] S6)
  # local.yaml 이 잠정값을 채운다.
  #
  # 규격이 숫자를 준 값은 여기 없다 — [05 §3]·[05 §5] 의 "서로 다른 소스 ≥ 2" 는
  # `registry/thresholds.MIN_SOURCES` 로 고정이다. 설정으로 낮출 값이 아니다.
  registry:
    # `keywords (domain, normalized_name)` UNIQUE 와 서비스 표 둘이 없으면 시작하지 않는다
    # ([09 §7] 항목 2, `io/keywords.py`). `ingest.contents.required` 와 같은 형태이고 이유도
    # 같다 — 없이 돌면 병합·검수 큐는 채워지는데 `keywords` 가 비어, 증상이 "트렌드가 하나도
    # 안 나온다" 로 화면에서야 나타난다. 로컬만 local.yaml 이 false 로 덮고, 그 밖에서는
    # `--allow-missing-keyword-unique` 로만 푼다. 그때는 크게 남기고 승격만 건너뛴다.
    required: true
    # 조건부 복수형 ([05 §2]). 한쪽 DF 가 다른 쪽의 이 배수를 넘어야 접는다.
    plural:
      df_dominance: null
    # 약어 ↔ 전개형 ([05 §3]). 괄호 패턴이 관측된 서로 다른 문서 수 하한.
    abbreviation:
      min_documents: null
    # 표기 변형(오타) 흡수 ([05 §3]).
    variant:
      min_length: null          # 이보다 짧으면 적용하지 않는다 (`Vue` ↔ `Sue`)
      max_edit_distance: null
      df_dominance: null
      # 색인 쪽(대표 후보) 크기 상한. 넘으면 변형 탐색을 건너뛰고 크게 남긴다 —
      # 조용히 몇 분을 태우는 것이 가장 나쁘다 (`registry/merge.py` 의 비용 절).
      max_index_size: 20000
    # 승격 관문 ([05 §5]). 모든 조건을 **함께** 만족해야 통과한다.
    promote:
      min_documents: null
      min_observed_days: null           # 연속일 필요 없음
      min_authors: null                 # **봇·자기홍보 방어의 핵심**
      min_representative_ratio: null    # 병합 그룹 문서 수 중 대표의 몫
    # 층 3 ([05 §4], [01 §5]). `model` 이 null 이면 층 3 이 아예 돌지 않는다 — 그게 기본이다.
    # 실제 모델은 torch 를 끌고 와 이미지가 1 GB 이상 커지고, NPMI([06])가 없는 동안은
    # 동의어와 연관어가 갈리지 않아 판별이 반쪽이다 ([10] 후속 표). 배선·캐시는 이미 있다.
    # `hash` 로 두면 의존성 없이 배선만 돌려 볼 수 있다 (유사도에 의미는 없다).
    embedding:
      model: null
      dim: 384
      batch_size: 64
    review:
      # 이 유사도 이상이면 검수 큐로. `model` 이 설정되면 이 값도 있어야 한다.
      similarity_floor: null
      # NPMI 상한 — 넘으면 연관어로 보고 큐에 올리지 않는다 ([05 §3]).
      # **[06] 이 계산하고 그건 다음 에픽이다** — 지금 값을 채워도 읽을 원자료가 없다.
      npmi_ceiling: null
  # 도메인별 차이 ([04 §8]). 같은 코드에 설정만 다르게 준다.
  domains:
    dev:
      code_identifiers: true       # camelCase · snake_case · dotted 를 한 토큰으로
      hashtag_weight: 1.0          # 해시태그 후보의 최종 점수에 곱한다. 1 이면 중립
      # 형태소 분석기가 어절을 쪼갠 뒤 후보 표기를 어디까지 붙여 쓸지 ([04 §2]).
      # core: 명사 핵만(`재해석한`→`해석`) · prefixed: 접두사+핵(`재해석`) ·
      # word: 파생 접미사까지(`아이템들`). hn 은 영문 제목뿐이라 무관하다
      surface_policy: prefixed
    fashion:
      code_identifiers: false      # 잡음만 는다
      hashtag_weight: 1.5          # 사람이 직접 고른 표현이라 값지다 — **잠정**
      # 2026-09-09 실측에서 셋을 다 돌려 비교하고 고른 값이다 ([04 §2] 의 표)
      surface_policy: prefixed

aggregate:
  # 서비스가 파는 기간 ([07 §4]). 값 규약은 백엔드와 합의 전이다 (09 §7 항목 3).
  periods: ["24H", "7D", "30D"]
  # 기준일 D = 실행일(KST) − 이 값. 1 은 "완결된 마지막 날" 이다 ([07 §4]). 0 으로 두면
  # 진행 중인 오늘을 완결된 어제와 비교하게 되어 증가율이 시각에 따라 뒤집힌다.
  reference_day_offset: 1
  # 소급 재계산 구간 W(일). 발행일 분포를 실측한 뒤 정한다 ([07 §2]) — 비면 Job 이 거부한다.
  recompute_window_days: null
  # keyword_metric_history 버킷 폭. 지금은 일 버킷만 지원한다 ([07 §3]).
  history_bucket: "1D"
  # 연관 키워드 기준 기간. 30D 를 제안했고 기획 답변 대기 중 ([06 §3]).
  related_window: "30D"
  thresholds: {}
