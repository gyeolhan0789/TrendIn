# 모든 프로파일의 바닥. 여기 없는 키는 프로파일 파일에도 없어야 한다 — 병합 결과를
# 읽을 때 이 파일만 보면 전체 형태를 알 수 있어야 한다.
#
# 병합 순서: base.yaml ← {profile}.yaml ← 환경변수 (09 §3).
# 비밀(비밀번호·시크릿 키)은 이 파일 계열에 적지 않는다. 환경변수로만 들어온다.

spark:
  master: "local[*]"
  conf:
    # 기본값 200 은 이 규모에서 순수 오버헤드다 (09 §2). 파티션당 수십 건짜리
    # 태스크 200 개를 만드는 데 계산보다 스케줄링에 시간이 더 든다.
    spark.sql.shuffle.partitions: 8
    # 내부 계산은 UTC 로 한다. 화면에 보이는 시각 변환은 백엔드가 한다.
    spark.sql.session.timeZone: "UTC"
    # 파티션 덮어쓰기를 쓸 때 건드리지 않은 파티션이 지워지지 않게 한다 ([01 §4] 중복 차단 3).
    spark.sql.sources.partitionOverwriteMode: "dynamic"

logging:
  level: "INFO"        # 파이썬 쪽
  spark_level: "WARN"  # JVM 쪽. INFO 로 두면 로그가 사람 눈으로 못 읽을 양이 된다

minio:
  endpoint: ""      # 비면 S3A 설정을 아예 걸지 않는다
  access_key: ""    # 환경변수 MINIO_ACCESS_KEY
  secret_key: ""    # 환경변수 MINIO_SECRET_KEY
  region: "us-east-1"  # MinIO 는 리전이 없지만 AWS SDK v2 가 값을 요구한다
  buckets:
    raw: "raw-data"      # 담당 1 소유. 읽기만 한다
    curated: "curated"   # Spark 소유 ([01 §3])
  # 그대로 spark.hadoop.* 로 넘어간다. 새 S3A 옵션 때문에 코드를 고치지 않으려고 둔다.
  hadoop_conf: {}

jdbc:
  url: ""       # 환경변수 APP_DB_URL
  user: ""      # 환경변수 APP_DB_USER
  password: ""  # 환경변수 APP_DB_PASSWORD
  driver: "org.postgresql.Driver"
  # 한 번에 보내는 행 수. 측정 전에는 드라이버 기본값을 쓴다.
  batch_size: 1000

# --- Job 별 ---------------------------------------------------------------
# 알고리즘 임계값은 아직 비어 있다. 실제 수집 데이터의 분포를 재기 전에 정한 숫자는
# 전부 다시 정하게 된다 (09 §7 항목 5). 04~07 이 숫자를 명시하지 않은 것도 같은 이유다.

ingest:
  ledger:
    # 장부 뷰에서 몇 시간을 거슬러 읽을지 (S15P21A102-247). 겹쳐 읽은 몫은 처리 이력이
    # 거르므로 넉넉한 쪽이 안전하다 — 창이 짧아 빠뜨리면 그 기사는 백필로만 들어온다.
    # 168시간은 Kafka 보존이던 7일 그대로다. 이 Job 이 그보다 오래 멈추면 백필이 필요하다.
    lookback_hours: 168
  contents:
    # `contents` 테이블이 없으면 시작하지 않는다 ([03 §8]). 없이 돌면 curated 에만 쓰이고
    # 서비스 테이블은 비어, 증상이 [04] 에서야 "관련 콘텐츠가 비어 있다" 로 나타난다.
    # 로컬만 local.yaml 이 false 로 덮고, 그 밖에서는 --allow-missing-contents 로만 푼다.
    required: true
  dlq:
    # DLQ 토픽 이름. 담당 2 가 정하면 채운다 ([02 §5]). 비어 있으면 테이블에만 쓴다.
    # 값이 있는데 토픽 싱크가 없으면 build_dlq_sink 가 경고한다 — 조용히 무시하면
    # "토픽에도 쓰고 있다" 고 믿게 된다.
    topic: ""
  # 정상 완료로 볼지 실패로 볼지가 갈리는 값들. [02] 를 채울 때 함께 정한다.
  thresholds: {}
  # 정제 문턱 (03). **전부 잠정이다** — 실제 수집 데이터의 문서 길이·문자 비율 분포를
  # 재기 전에 정한 숫자라 S6 에서 다시 정하고, 그때 pl_config_history 에 초기값이
  # 기록된다 (09 §7 항목 5). 여기 값을 코드에 박지 않은 이유가 그 재확정이다.
  #
  # 값을 비워두지 않고 잠정값을 적는 이유는 04~07 의 임계값과 사정이 다르기 때문이다.
  # 그쪽은 없으면 Job 이 거부하면 되지만, 정제는 문턱이 없으면 아무 문서도 걸러지지
  # 않고 조용히 전량 통과한다 — 그게 더 나쁘다.
  normalize:
    # 언어 판별 (03 §5). 문자 비율로만 판별하고 판별 라이브러리를 쓰지 않는다.
    # ja·zh·fr·it 도 2026-09-19 부터 추출한다 (`normalize/lang.LANGUAGES`). 그 전에는
    # 알아보기만 하고 필터가 UNSUPPORTED_LANG 으로 뺐고, 3개월치에서 6,948건이 그렇게 사라졌다.
    # 아래 다섯 값은 해외 소스 실데이터가 없을 때 정한 잠정값이다. 기울기는 en 쪽이다 —
    # 영어 제목이 fr·it 로 뒤집히면 hn 문서가 통째로 버려진다.
    lang:
      dominant: 0.6     # 한쪽 문자가 이 비율을 넘으면 그 언어
      secondary: 0.2    # 둘 다 이 비율을 넘으면 mixed
      min_letters: 10   # 글자가 이보다 적으면 unknown
      cjk_min_letters: 5  # 한자·가나가 이만큼은 있어야 ja·zh 를 본다
      cjk_share: 0.3      # 전체 글자 중 한자·가나 비율 하한
      kana_share: 0.05    # 한자·가나 중 가나가 이 비율을 넘으면 ja, 아니면 zh
      latin_min_words: 6  # 낱말이 이보다 적으면 기능어를 보지 않고 en
      latin_min_hits: 3   # fr·it 기능어가 이만큼 나오고 영어 기능어보다 많아야 그 언어
    # 품질 필터 (03 §6). 본문 있는 문서와 없는 문서에 다른 줄이 적용된다.
    filters:
      min_body_len: 100   # 정제 후 본문 길이 하한
      min_title_len: 5    # 제목 길이 하한. 본문 없는 문서가 이것만 본다
    # 근사 중복 (03 §6 3단계). 64비트 SimHash 의 해밍 거리 상한.
    # 낮으면 크로스포스트를 놓치고 높으면 다른 기사를 같은 것으로 묶는데, 후자가 더 나쁘다 —
    # 언급량이 실제보다 줄고 그게 잘못된 하락 판별이 된다 (07 §5).
    #
    # 12 의 근거는 2026-09-08 실측이다 (dedup.DedupThresholds 의 표) — 같은 글을 가볍게
    # 손본 쌍이 8~13, 무관한 글이 31~40 이었다. 두 군집이 13 과 31 사이에서 갈린다.
    # 통상값 3 으로 두면 3단계가 사실상 놀고 있다.
    dedup:
      max_distance: 12

extract:
  # [04] 의 임계값. **`null` 인 키가 하나라도 있으면 Job 이 시작하지 않는다**
  # (`extract/thresholds.py`). 아래 둘이 그것이다 — 근거가 없어서가 아니라 **실데이터에서
  # 다시 재야 하는 값**이기 때문이다. 200건 표본(한국 매체 한국어)에서는 상위 20 · 하한 0.15
  # 가 가장 좋았다. local.yaml 과 dev.yaml 이 잠정값을 채우고, 확정하면 여기로 옮기며
  # pl_config_history 에 초기값을 남긴다 ([09 §7] 항목 5).
  #
  # ⚠️ **2026-09-16 에 비워 둔 값이 여덟에서 둘로 줄었다.** 후보 생성이 문자열 통계에서 실체
  # 인식으로 옮겨지면서 DF 상하한 · 다섯 축 가중치 · n-gram 길이 · 코퍼스 창이 전부 없어졌다
  # (`extract/entities.py`, `scratchpad/kwlab/RESULTS.md`).
  per_document_top_k: null
  score_floor: null
  # 실체 인식기 ([04 §2]). **모델을 설정으로 뺀 이유** — 일본어의 절 문제를 다른 모델이 푸는지
  # 아직 모른다. 바꿔 보는 것이 코드 수정이 아니라 이 줄을 고치는 일이어야 한다.
  recognizer:
    # 다국어 GLiNER. 209M 파라미터 · apache-2.0. 이미지가 torch 때문에 약 800MB 커진다
    model: "urchade/gliner_multi-v2.1"
    # **낮게 잡고 뒤에서 거른다.** 높은 문턱은 추론을 다시 해야 바꿀 수 있지만, 낮게 뽑아
    # 두면 어떤 문턱도 걸러내기만 하면 된다. 0.35 보다 0.15 가 F1 이 높았다 (0.470 대 0.461)
    threshold: 0.15
    # 토막 분할 ([04 §2], `extract/chunking.py`). **모델 상한 384 에서 나오는 값이라 코퍼스와
    # 무관하다** — 위 `per_document_top_k` 처럼 비워 둘 값이 아니다.
    #
    # 표본 138건에서 `max_length=768` 로 상한을 올리는 길과 나란히 쟀고, 같은 768 어절
    # 범위에서 **토막이 더 빠르면서(2.37 대 2.58초) 고유 키를 1.45배 더 건졌다.**
    chunk:
      # 토막 하나의 **모델 토큰 수** (`chunking.count_tokens`). 상한 384 의 67% 다.
      # ⚠️ 어절 수가 아니다 — `WhitespaceTokenSplitter` 가 기호를 따로 세어 한국어에서
      # 어절의 약 1.5배가 나온다. 상한까지 채우지 않는 것은 서브워드가 다시 2.9~3.2배로
      # 부풀어 자기 주의 비용이 커지기 때문이다
      words: 256
      # 겹침 토큰 수. 약 9%. 문장 경계에서 끊으므로 낮게 시작한다
      overlap: 24
      # 문서 하나가 쓸 수 있는 토막 수. 옛 `max_chars` 가 하려던 비용 상한이다
      max_chunks: 3
    # 배치 구성. **문서 수가 아니라 어절 수 예산으로 묶는다** — 길이가 다른 토막을 한 배치에
    # 넣으면 짧은 쪽이 긴 쪽 길이로 패딩된다. 이 배칭만으로 1.37배 빨라졌고 결과는 같았다.
    batch:
      # 한 배치가 쓸 토큰 예산. 최장 토막 × 토막 수가 이 값을 넘지 않는다
      words: 2048
      size: 32
  # 언어별 후처리 ([04 §2], `extract/adapters.py`). **언어를 아는 곳은 거기 하나다.**
  language:
    # 그 언어에서 통과시킬 라벨. 적지 않은 언어는 전부 통과한다.
    #
    # **일본어를 반만 켠다.** 일본어 실기사 3건에서 원본 구간의 32~60% 가 절이거나 복합
    # 구간이었고(`scratchpad/kwlab/MULTILINGUAL.md` §2.3), 형태소로 고치려는 시도는 브랜드
    # 표기의 공백을 잃는 대가를 치렀다(같은 문서 §3). 브랜드와 인물은 후처리 없이도
    # 0.83~0.99 로 나온다. 일본어 정답을 만들어 잰 뒤 늘린다.
    labels:
      ja: ["브랜드", "인물", "회사 또는 조직"]
    # 일본어 표기의 글자 수 상한. 다른 언어보다 낮다 — 공백이 없어 같은 글자 수가 더 많은
    # 내용을 담고, 절이 그대로 통과하는 것을 막는 마지막 문턱이다
    ja_max_chars: 20
  candidate:
    min_chars: 2      # 비교키 문자 수 하한 ([04 §5] 2번)
    max_chars: 40     # 상한. 이보다 길면 문장이다
  # BM25 파라미터. **점수에 들어가지 않고 칸에만 적힌다** (`extract/scoring.py` 의 주석) —
  # 꼬리 재현율에서 값을 하는지는 실데이터를 보고 정할 일이고, 적어 두지 않으면 그 판단에
  # 재추출이 필요하다.
  bm25:
    k1: 1.2
    b: 0.75
  # 형태소 분석기 사용자 사전이 있는 디렉터리. submit.sh 가 pipeline/ 에서 실행하므로
  # 거기 기준 상대 경로다. 들어 있는 것은 `userdict-{domain}.txt` 뿐이다.
  #
  # **불용어·노이즈 사전은 2026-09-17 에 지웠다** — 라벨이 무엇이 키워드인지 정의하므로 뺄
  # 것을 셀 필요가 없고, 읽는 코드가 사라진 뒤로 파일만 남아 있었다.
  lexicon_dir: "spark/conf/lexicon"
  # [05] 의 문턱 — 정규화·통합·승격. **`null` 인 키가 하나라도 있으면 Job 이 시작하지
  # 않는다** (`registry/thresholds.py`). 위 `extract.*` 와 같은 규약이고 이유도 같다:
  # 승격은 되돌릴 수 없으므로([05 §1]) 근거 없는 문턱으로 서비스 테이블에 행을 넣는 것보다
  # 시작을 거부하는 것이 싸다. 승격 문턱은 후보 분포를 본 뒤라야 정할 수 있어([10 §4] S6)
  # local.yaml 이 잠정값을 채운다.
  #
  # 규격이 숫자를 준 값은 여기 없다 — [05 §3]·[05 §5] 의 "서로 다른 소스 ≥ 2" 는
  # `registry/thresholds.MIN_SOURCES` 로 고정이다. 설정으로 낮출 값이 아니다.
  registry:
    # `keywords (domain, normalized_name)` UNIQUE 와 서비스 표 둘이 없으면 시작하지 않는다
    # ([09 §7] 항목 2, `io/keywords.py`). `ingest.contents.required` 와 같은 형태이고 이유도
    # 같다 — 없이 돌면 병합·검수 큐는 채워지는데 `keywords` 가 비어, 증상이 "트렌드가 하나도
    # 안 나온다" 로 화면에서야 나타난다. 로컬만 local.yaml 이 false 로 덮고, 그 밖에서는
    # `--allow-missing-keyword-unique` 로만 푼다. 그때는 크게 남기고 승격만 건너뛴다.
    required: true
    # 조건부 복수형 ([05 §2]). 한쪽 DF 가 다른 쪽의 이 배수를 넘어야 접는다.
    plural:
      df_dominance: null
    # 약어 ↔ 전개형 ([05 §3]). 괄호 패턴이 관측된 서로 다른 문서 수 하한.
    abbreviation:
      min_documents: null
      # 음차 유사도 하한 (`registry/romanize.py`). 한글을 로마자로 펴서 괄호 안 표기와
      # 비교한다 — `메시카` → `mesika` ↔ `Messika`. 초성 대응이 성립하지 않는 한국어
      # 전개형은 이 값이 근거가 되고, 그때 위 `min_documents` 를 갈음한다.
      #
      # **측정이 필요한 값이 아니라 이미 잰 값이라 여기 있다** (2026-09-10, fashion 코퍼스의
      # 이름꼴 고유 쌍 275개): 0.5 에서 진짜 병기 쌍 66% 통과 · 무작위로 섞은 쌍 1% 통과.
      # 올리면 놓치는 브랜드가 늘고, 내리면 번역(`황소 가죽(Bull Leather)` 0.09)이 섞인다.
      transliteration_floor: 0.5
    # 표기 변형(오타) 흡수 ([05 §3]).
    variant:
      min_length: null          # 이보다 짧으면 적용하지 않는다 (`Vue` ↔ `Sue`)
      max_edit_distance: null
      df_dominance: null
      # 색인 쪽(대표 후보) 크기 상한. 넘으면 변형 탐색을 건너뛰고 크게 남긴다 —
      # 조용히 몇 분을 태우는 것이 가장 나쁘다 (`registry/merge.py` 의 비용 절).
      max_index_size: 20000
    # 승격 관문 ([05 §5]). 모든 조건을 **함께** 만족해야 통과한다.
    promote:
      min_documents: null
      min_observed_days: null           # 연속일 필요 없음
      min_authors: null                 # **봇·자기홍보 방어의 핵심**
      min_representative_ratio: null    # 병합 그룹 문서 수 중 대표의 몫
    # 층 3 ([05 §4], [01 §5]). `model` 이 null 이면 층 3 이 아예 돌지 않는다 — 그게 기본이다.
    # 실제 모델은 torch 를 끌고 와 이미지가 1 GB 이상 커지고, NPMI([06])가 없는 동안은
    # 동의어와 연관어가 갈리지 않아 판별이 반쪽이다 ([10] 후속 표). 배선·캐시는 이미 있다.
    # `hash` 로 두면 의존성 없이 배선만 돌려 볼 수 있다 (유사도에 의미는 없다).
    embedding:
      model: null
      dim: 384
      batch_size: 64
    review:
      # 이 유사도 이상이면 검수 큐로. `model` 이 설정되면 이 값도 있어야 한다.
      similarity_floor: null
      # NPMI 상한 — 넘으면 연관어로 보고 큐에 올리지 않는다 ([05 §3]).
      # **[06] 이 계산하고 그건 다음 에픽이다** — 지금 값을 채워도 읽을 원자료가 없다.
      npmi_ceiling: null
  # 도메인별 차이 ([04 §8]). **라벨 목록뿐이다** — 옛 `code_identifiers` ·
  # `hashtag_weight` · `surface_policy` 는 전부 토크나이저의 옵션이었고 함께 없어졌다.
  #
  # 라벨을 바꾸면 모든 언어가 같이 바뀐다. 바꿀 때는 `scratchpad/kwlab` 의 정답으로 전 언어를
  # 다시 재야 한다.
  domains:
    dev:
      labels:
        - "프로그래밍 언어"
        - "라이브러리 또는 프레임워크"
        - "도구 또는 서비스"
        - "기술 개념"
        - "회사 또는 조직"
        - "인물"
    fashion:
      # 색상을 뺀 것이 F1 0.470 → 0.504 다. 색상은 정밀도 0.35 인데 기사마다 쏟아져 상위
      # 열 자리를 먹는다. 라벨을 더 잘게 쪼개는 것(8 → 13~14개)은 값이 없었다
      labels:
        - "브랜드"
        - "의류 품목"
        - "소재"
        - "패션 스타일"
        - "인물"
        - "컬렉션 또는 행사"

aggregate:
  # 서비스가 파는 기간 ([07 §4]). **값 규약이 확정됐다** — 백엔드 `AnalysisPeriod` 의
  # `@EnumeratedValue` 가 이 문자열을 그대로 쓰고, 컬럼 타입은 네이티브 enum `metric_period` 다.
  # 그래서 적재에 `::metric_period` 캐스트가 붙는다 (`io/metrics.py`).
  periods: ["24H", "7D", "30D"]
  # 국가별 일 언급량 ([08 §4] `keyword_country_daily_metrics`) 에는 **설정이 없다**
  # (2026-09-18). 전에는 `country.code` 로 전 키워드를 한 나라로 채웠는데, 상류에 국가가
  # 없던 동안 표를 비워 두지 않으려는 임시 값이었다. 이제 원자료(`pl_keyword_daily_stat
  # .source_country`)가 나라를 알고, 재계산 창은 아래 `recompute_window_days` 를 함께 쓴다.
  #
  # 값이 오는 길은 `src/trendin/spark/common/countries.py` 의 머리말에 있다.
  # 연관 키워드 ([06], `metrics/relations.py`). **코퍼스를 기다릴 값이 아니다** — 창은 가장
  # 긴 기간(`30D`)에 맞춘 기획 결정이고, 나머지 둘은 표 크기를 묶는 값이다.
  relations:
    # 동시출현을 세는 창. 지표의 `30D` 와 같은 시기를 봐야 화면에서 어긋나지 않는다
    window_days: 30
    # 쌍이 관측된 문서 수의 하한. **2 미만은 거부한다** — 문서 한 건에만 함께 나온 쌍도
    # 둘 다 그 문서에만 있으면 자카드가 100 이 되어 상위를 먹는다
    min_co_occurrence: 2
    # 키워드 하나가 갖는 연관의 수. 쌍은 문서당 후보 수의 제곱으로 늘어난다
    top_n: 20
  # 기준일 D = 실행일(KST) − 이 값. 1 은 "완결된 마지막 날" 이다 ([07 §4]). 0 으로 두면
  # 진행 중인 오늘을 완결된 어제와 비교하게 되어 증가율이 시각에 따라 뒤집힌다.
  #
  # **백엔드가 같은 구간을 독립으로 계산해 등호로 조회한다** (`AnalysisWindow.completed`:
  # recentEnd = 오늘 KST 자정, recentStart = end − 기간). 그 값과 우리가 적는
  # `period_start`·`period_end` 가 한 자리라도 다르면 목록이 통째로 빈다. 1 이 그 일치를 준다.
  reference_day_offset: 1
  # 소급 재계산 구간 W(일). **2026-09-10 실측으로 확정했다** —
  # `tests/fixtures/review/publish-lag-2026-09-10.md`. 정상 운영 지연은 p95=0 · 7일 이상이
  # 1건뿐이라 하한은 3 이지만, 표본이 이틀치로 얇고 이 구간이 임계값 변경·병합의 반영 창을
  # 겸하므로([04 §10], [05 §8]) 크게 잡았다. 비면 Job 이 거부한다 ([07 §2]).
  recompute_window_days: 30
  # 서비스 테이블 셋이 없으면 시작하지 않는다 (`io/metrics.py`). `ingest.contents.required` ·
  # `extract.registry.required` 와 같은 형태이고 이유도 같다 — 없이 돌면 계산은 되는데 아무
  # 데도 안 남고, 증상이 "화면이 비었다" 로 나타난다. 로컬만 local.yaml 이 false 로 덮고,
  # 그 밖에서는 `--allow-missing-service-tables` 로만 푼다.
  service:
    required: true
  # keyword_metric_history 버킷 폭. `1D` 또는 `1H` ([07 §3]).
  #
  # 백엔드는 기간마다 다른 폭을 기대한다 (`AnalysisPeriod.getHistoryBucketDuration`) —
  # 24H 는 1시간, 7D 는 1일, 30D 는 3일이다. 저장이 일 버킷이면 7D·30D 는 백엔드가 합산해
  # 맞아떨어지지만 **24H 는 하루치가 첫 한 시간에 몰리고 나머지 23칸이 0 으로 그려진다.**
  #
  # `1H` 는 발행 시각을 `contents` 에서 되찾아 시간 버킷을 낸다. 세 기간이 다 이걸로 된다 —
  # 백엔드는 `bucket_start` 로만 긁어와 자기가 세운 버킷에 합산하고 저장된 `bucket_end` 는
  # 읽지 않으므로, **가장 잘은 폭 하나만 있으면 된다** (`TrendHistoryService.getHistory`).
  # 반대로 폭을 섞으면 같은 구간이 두 번 세어진다.
  #
  # ⚠️ 그 조인이 `pl_document_candidate` 를 거치므로 **그 표의 보존 지평 밖은 버킷이
  # 만들어지지 않는다** ([08 §3]). 30D 그래프를 끝까지 덮으려면 보존 기간이 재계산 구간
  # 이상이어야 한다.
  history_bucket: "1H"
  # 연관 키워드 기준 기간. 30D 를 제안했고 기획 답변 대기 중 ([06 §3]).
  related_window: "30D"
  # 순위를 개념 단위로 낼지 (`metrics/concepts.py`). **개념 표가 없으면 이 값과 무관하게
  # 꺼진다** — 개념 Job 을 안 돌린 환경에서 집계가 서면 안 되기 때문이다.
  #
  # 켜 두는 것이 기본인 이유는 2026-09-19 실측이다. fashion 3개월에서 30D 상위 100 표기가
  # 실제로는 82 개념이었고, `leather`·`pelle`·`가죽`·`cuir` 가 8·11·34·59 위로 흩어져 합치면
  # 1위인 것이 아무 자리도 제대로 갖지 못했다. 같은 실행에서 표기 832개가 대표로 접혔다.
  #
  # **끌 수 있게 둔 이유는 사전이 틀릴 때다.** 개념이 잘못 묶이면 순위가 통째로 어긋나는데,
  # 사전을 고쳐 다시 붙이는 것보다 이 줄을 내리는 편이 빠르다. 내리면 표기 단위로 돌아간다.
  concepts:
    fold: true
    # `pl_concept.countable = false` 인 개념을 순위와 배지에서 뺄지. 일반어(`collection` ·
    # `요즘` · 대명사)·총칭(`clothing` · `fabric`)·매체(`Vogue` · `Elle`)가 그 대상이고,
    # 2026-09-19 실행에서 324개가 여기 걸렸다.
    #
    # **`fold` 와 따로 두는 이유** — 접기는 순위표의 자리를 아끼는 일이고 이쪽은 무엇을
    # 세는지를 정하는 일이라, 사전이 의심스러울 때 갈라서 꺼 볼 수 있어야 한다.
    drop_uncountable: true
  # [07 §5]·[07 §6] 의 문턱. **`null` 인 키가 하나라도 있으면 Job 이 시작하지 않는다**
  # (`metrics/thresholds.py`). `extract.*`·`extract.registry.*` 와 같은 규약이고 이유도 같다 —
  # 근거 없는 문턱으로 서비스 테이블에 트렌드 배지를 다는 것보다 시작을 거부하는 것이 싸다.
  # local.yaml 이 실측을 돌릴 잠정값을 채운다.
  #
  # 규격이 숫자를 준 값은 여기 없다 — [07 §6] 의 "서로 다른 소스 ≥ 2" 는
  # `metrics/thresholds.MIN_SOURCES` 로 고정이다. 설정으로 낮출 값이 아니다.
  thresholds:
    # 0 행을 쓸 활성 키워드의 정의 ([07 §3]) — 최근 이 며칠 안에 한 번이라도 언급이 있었나.
    # 정규 키워드 전체 × W 를 매 실행 갱신하면 대부분이 0 인 행을 대량으로 쓰게 된다.
    active_window_days: 30
    current:
      # [07 §6] 초기 규칙 — 도메인·기간별 mention_rank 이 이 값 이하.
      top_n: 5
    rising:
      # 셋을 **함께** 넘어야 한다 ([07 §6]). 증가율만 보면 3→9(200%)가 500→700(40%)을
      # 앞서고, 증가량만 보면 큰 키워드가 늘 이긴다.
      min_growth_amount: null   # A
      min_growth_rate: null     # B — 퍼센트
      # **C 가 없으면 급상승 목록이 전부 극소 표본이 된다** ([07 §6] 의 경고). 1→3 이 200% 다.
      min_mention_count: null   # C
      top_n: 5
      # 급상승에서 뺄 개념 분류 (`pl_concept.category`). **지금은 비어 있다.**
      #
      # 2026-09-19 에 `material` 로 넣었다. 로컬(4,945문서) 24H 다섯 자리를 `flannel`·
      # `cashmere`·`wool` 이 셋 먹어서였고, 넣은 뒤 세 기간 15자리에 소재가 0개가 됐다.
      # 이튿날 서버에서 `바지` 가 30D 에 올라 `apparel` 을 더했다.
      #
      # **그리고 같은 날 둘 다 뺐다 — 목록이 굶었다.** 서버 코퍼스(238기사)는 조건을 넘는
      # 후보 자체가 적은데 분류로 또 거르니 `30D` 급상승이 **한 자리**만 찼다 (`top_n` 은 5).
      # 빈 목록보다 품목이 섞인 목록이 낫다.
      #
      # **코퍼스가 크면 다시 넣을 값이다.** 로컬에서는 후보가 기간당 10~26개라 셋을 빼도
      # 다섯이 찼다. 그 규모가 되면 `["material"]` 부터 되돌린다 — 분류를 보는 배선은
      # `metrics/concepts.py` 에 그대로 있고 이 줄만 채우면 산다.
      exclude_categories: []
    new:
      # 기간마다 "이전" 의 길이가 다르다 ([07 §6]). `quiet_days` 는 현재 구간 **바로 앞**의
      # 며칠을 보는지이고, 이 값이 원자료 보존 지평의 하한을 정한다 (30D → 30+90 = 120일).
      # 24H 의 (<=1, >=5) 만 규격이 숫자를 줬고 나머지는 실측 후 확정이다.
      windows:
        "24H": {quiet_days: 7, quiet_max: 1, min_mentions: 5}
        "7D": {quiet_days: 30, quiet_max: null, min_mentions: null}
        "30D": {quiet_days: 90, quiet_max: null, min_mentions: null}
      top_n: 5
    # 무정보어 자동 제외 ([07 §6]) — `요즘`·`매력` 처럼 이 코퍼스에서 늘 흔한 말은 자기 과거를
    # 배경으로 놓으면 z ≈ 0 이다. 사전에 손으로 올리는 대신 이 축이 거른다.
    zscore:
      # 배경 분포를 재는 구간(일). 현재 구간 앞쪽만 본다 — 현재를 배경에 넣으면 자기 자신과
      # 비교하게 되어 급증이 희석된다.
      background_days: null
      # 배경 표본이 이보다 적으면 z 를 내지 않는다 (신생 키워드). null 로 두지 않고 통과시킨다 —
      # 갓 뜬 키워드를 무정보어로 몰지 않기 위해서다.
      min_background_days: null
      # RISING 이 요구하는 최소 z. 배경 대비 이만큼 튀지 않으면 "늘 흔한 말" 로 본다.
      min_z: null
    # [07 §8] 저자당 일별 기여 상한 C. **`null` = 꺼짐이고 지금이 그 상태다.**
    # 2026-09-09 실데이터에서 상한 3 이 바꾸는 행이 28,433 중 29(0.1%)뿐이라 넣지 않았다
    # (`tests/fixtures/review/publish-lag-2026-09-10.md`). 켜려면 원자료에 저자별 건수를
    # 남기는 재집계가 **선행**이다 — `pl_keyword_daily_stat` 에는 지금 그 근거가 없다.
    author_daily_cap: null

concept:
  # 개념 층 (`src/trendin/spark/concept/`). 승격된 키워드를 언어 무관 개념 번호에 붙인다.
  #
  # 여기 값은 측정값이 아니라 **정책**이라 숫자를 적어 둔다 (`ingest.normalize` 와 같은 사정 —
  # 비우면 거부가 아니라 조용한 전량 통과가 된다). 그래도 `null` 로 지운 것은 Job 이 받지 않는다
  # (`concept/thresholds.py`).
  #
  # 최근 며칠 분의 선별 후보를 다시 붙이나. `aggregate.recompute_window_days` 와 같은 뜻이고
  # 같은 값 — 사전이 바뀌면 이 창 안의 기사는 다음 실행이 저절로 고친다. 밖은 손으로 돌린다.
  window_days: 30
  # 개념 표 넷(pl_concept · pl_concept_category · pl_concept_expression · pl_article_concept)은
  # 서비스 표가 아니라 우리 표다 — 스프링이 읽지 않으므로 Flyway 를 거치지 않고 Job 이 만든다
  # (2026-09-17). 화면이 개념을 읽게 되면 그때 서비스 표로 승격한다.
  #
  # 초기 사전 파일. 저장소 루트 기준. `*.json` 전부를 읽는다 (`concept/seed.py`).
  # **매 실행이 반영한다** — 사람이 한 번 넣는 선행 조건으로 두면 순서를 틀렸을 때 미등록 더미가
  # 남는다. 여기서 아무것도 못 읽으면 Job 이 붙이지 않고 설정 오류로 선다.
  seed_dir: "spark/conf/concepts"
  unmapped:
    # 미등록 표현이 후보 생성·판정 대상이 되는 기사 수. 승격 관문(`extract.registry.promote
    # .min_documents`)과 같은 눈금이다 — 여기 오는 것은 이미 승격된 키워드라 사실상 늘 넘지만,
    # 사전 변경으로 미등록으로 떨어진 표현이 한 건짜리로 큐를 채우는 것을 막는다.
    min_articles: 5
    # 표현당 남기는 문맥 표본 수. 검수자가 읽을 양이고 나중에 판정에 넣을 양이다.
    context_samples: 20
