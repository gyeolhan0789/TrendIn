# 로컬 개발. Spark 는 컨테이너 밖 .venv 에서 돌고, Kafka · MinIO · PostgreSQL 은
# 컴포즈 안에서 돈다. 그래서 주소가 전부 호스트에 열린 포트다 (09 §2).
#
# 포트의 출처:
#   kafka    datastore/compose.yaml 의 EXTERNAL 리스너 (KAFKA_EXTERNAL_PORT, 기본 29092)
#   minio    datastore/compose.yaml 의 API 포트 (MINIO_API_PORT, 기본 9000)
#   postgres pipeline/spark/compose.dev.yaml 이 여는 포트 (APP_DB_PORT, 기본 55432)
#
# 키와 비밀번호는 여기 없다. spark/.env 를 읽어 환경변수로 넣는다.

spark:
  conf:
    spark.sql.shuffle.partitions: 4

logging:
  level: "INFO"
  spark_level: "WARN"

kafka:
  bootstrap_servers: "127.0.0.1:29092"

minio:
  endpoint: "http://127.0.0.1:9000"

jdbc:
  url: "jdbc:postgresql://127.0.0.1:55432/trendin"
  user: "trendin"

checkpoint:
  # 저장소 안. spark/.gitignore 가 뺀다. 지우는 절차는 [02 §6].
  root: "spark/.checkpoints"

ingest:
  contents:
    # 로컬은 백엔드가 contents 를 만들기 전에도 돌려본다. 운영 기본은 base.yaml 의 true 다.
    required: false

extract:
  # **전부 잠정이다.** base.yaml 은 이 키들을 null 로 두어 운영에서 측정 없이 돌지 못하게 하고,
  # 로컬은 S6 가 분포를 재는 데 쓸 값이 필요해 여기 채운다 ([10 §4] S6, 09 §7 항목 5).
  # 근거 없는 숫자다 — 여기 값을 base.yaml 로 옮기는 것이 S6 의 산출물이다.
  corpus_window_days: 30    # [10 §2] 5번의 "직전 30일" 을 그대로. 발행일 분포를 재고 정한다
  df_min_ratio: 0.003       # 하루 700건 × 30일 ≈ 2만 문서에서 약 60건. 첫 실행(수백 건)에서는 1~2건
  df_max_ratio: 0.3         # 코퍼스의 30% 를 넘으면 도메인 이름 수준의 무정보어로 본다
  score_weights:
    c_value: 0.3
    bm25: 0.4
    title: 0.3
  per_document_top_k: 10    # [04 §9] 의 precision@10 과 같은 K
  score_floor: 0.2
  # [05] 의 문턱. 위와 같이 **전부 잠정이다.** 다만 근거가 아예 없는 숫자는 아니고,
  # 2026-09-09 실데이터(fashion 373건 · 고유 저자 78 · 소스 7)의 분포를 보고 골랐다.
  # 확정은 S6 가 후보 분포를 재고 base.yaml 로 옮기는 일이다 ([10 §4] S6).
  registry:
    # 로컬은 백엔드가 UNIQUE 를 걸기 전에도 돌려본다. 운영 기본은 base.yaml 의 true 다.
    # 이 값이 false 면 승격만 건너뛰고 병합·검수 큐·이력은 그대로 채워진다.
    required: false
    plural:
      # 실측 `사람들`(35문서) 대 `사람`(71) 이 비율 2.03 이다. 5 로 두면 **안 접힌다** —
      # [05 §2] 가 "양쪽이 다 흔한 쌍은 접히지 않는다" 를 요구한 그 결과다.
      df_dominance: 5
    abbreviation:
      # 한 사람의 오기가 아님을 보이는 최소. 소스 2곳 조건과 함께 걸린다.
      min_documents: 3
    variant:
      # 한국어 5자면 꽤 긴 낱말이다. [05 §3] 이 "4자 이하 제외" 를 영어 예로 적었고,
      # 한국어에서 이 값이 적절한지는 S6 가 재야 한다 — 낮추면 `모델`/`모텔` 이 걸린다.
      min_length: 5
      max_edit_distance: 2
      # 오타는 드물다는 가정. 대표가 흡수 후보의 10배 이상 흔해야 오타로 본다.
      df_dominance: 10
    promote:
      # DF 하한이 2 라(위 df_min_ratio) 승격은 그보다 높아야 한다. 373건 코퍼스에서
      # 5문서면 상위권이고, 코퍼스가 2만으로 자라면 이 값은 다시 올라가야 한다.
      min_documents: 5
      # "하루 반짝하는 이벤트" 를 막는 최소값 ([05 §5]).
      min_observed_days: 2
      # 실측 저자당 평균 4.8건. 3명이면 한 사람이 뿌린 것은 통과하지 못한다 —
      # **자동 발견이 실패하는 대표적 형태**가 그것이다 ([05 §5]).
      min_authors: 3
      # 대표가 그룹 문서의 과반을 넘게. 표기가 갈린 그룹의 승격을 미룬다.
      min_representative_ratio: 0.6
    # 층 3 은 꺼 둔다 — base.yaml 의 주석이 근거다. 배선을 돌려 보려면 `hash` 로 바꾸고
    # `review.similarity_floor` 를 채운다 (유사도에 의미는 없으니 큐에 잡음이 쌓인다).
    embedding:
      model: null
