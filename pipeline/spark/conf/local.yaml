# 로컬 개발. Spark 는 컨테이너 밖 .venv 에서 돌고, MinIO · PostgreSQL 은
# 컴포즈 안에서 돈다. 그래서 주소가 전부 호스트에 열린 포트다 (09 §2).
#
# 포트의 출처:
#   minio    datastore/compose.yaml 의 API 포트 (MINIO_API_PORT, 기본 9000)
#   postgres pipeline/spark/compose.dev.yaml 이 여는 포트 (APP_DB_PORT, 기본 55432)
#
# 키와 비밀번호는 여기 없다. spark/.env 를 읽어 환경변수로 넣는다.

spark:
  conf:
    spark.sql.shuffle.partitions: 4

logging:
  level: "INFO"
  spark_level: "WARN"

minio:
  endpoint: "http://127.0.0.1:9000"

jdbc:
  url: "jdbc:postgresql://127.0.0.1:55432/trendin"
  user: "trendin"

ingest:
  contents:
    # 로컬은 백엔드가 contents 를 만들기 전에도 돌려본다. 운영 기본은 base.yaml 의 true 다.
    required: false

extract:
  # **잠정이다.** base.yaml 이 이 둘을 null 로 두어 측정 없이 돌지 못하게 하고, 여기서
  # 채운다 ([10 §4] S6, [09 §7] 항목 5).
  #
  # 200건 표본·정답 20건에서 상위 K 를 10~25 로 훑었고 20 에서 F1 이 가장 높았다
  # (`scratchpad/kwlab/RESULTS.md` §1). 30 인 이유는 그 표본이 한국 매체 한국어뿐이고,
  # **승격에는 영향이 없기** 때문이다 — 언급량과 승격 심사는 필터를 통과한 전부를 세고
  # `selected` 를 보지 않는다 ([04 §7]). 이 값이 정하는 것은 `keyword_contents`(상세
  # 화면의 관련 콘텐츠)와 [06] 동시출현이다.
  per_document_top_k: 30
  # 모델 점수의 하한. 인식기 문턱(0.15)보다 높게 두어 두 단계로 거른다 — 문턱은 추론을
  # 다시 해야 바뀌지만 이 값은 재추출로 바뀐다.
  score_floor: 0.2
  registry:
    # 로컬은 백엔드가 UNIQUE 를 걸기 전에도 돌려본다. 운영 기본은 base.yaml 의 true 다.
    # 이 값이 false 면 승격만 건너뛰고 병합·검수 큐·이력은 그대로 채워진다.
    required: false
    plural:
      # 실측 `사람들`(35문서) 대 `사람`(71) 이 비율 2.03 이다. 5 로 두면 **안 접힌다** —
      # [05 §2] 가 "양쪽이 다 흔한 쌍은 접히지 않는다" 를 요구한 그 결과다.
      df_dominance: 5
    abbreviation:
      # 한 사람의 오기가 아님을 보이는 최소. 소스 2곳 조건과 함께 걸린다.
      min_documents: 3
    variant:
      # 한국어 5자면 꽤 긴 낱말이다. [05 §3] 이 "4자 이하 제외" 를 영어 예로 적었고,
      # 한국어에서 이 값이 적절한지는 S6 가 재야 한다 — 낮추면 `모델`/`모텔` 이 걸린다.
      min_length: 5
      max_edit_distance: 2
      # 오타는 드물다는 가정. 대표가 흡수 후보의 10배 이상 흔해야 오타로 본다.
      df_dominance: 10
    promote:
      # DF 하한이 2 라(위 df_min_ratio) 승격은 그보다 높아야 한다. 373건 코퍼스에서
      # 5문서면 상위권이고, 코퍼스가 2만으로 자라면 이 값은 다시 올라가야 한다.
      min_documents: 5
      # "하루 반짝하는 이벤트" 를 막는 최소값 ([05 §5]).
      min_observed_days: 2
      # 실측 저자당 평균 4.8건. 3명이면 한 사람이 뿌린 것은 통과하지 못한다 —
      # **자동 발견이 실패하는 대표적 형태**가 그것이다 ([05 §5]).
      min_authors: 3
      # 대표가 그룹 문서의 과반을 넘게. 표기가 갈린 그룹의 승격을 미룬다.
      min_representative_ratio: 0.6
    # 층 3 은 꺼 둔다 — base.yaml 의 주석이 근거다. 배선을 돌려 보려면 `hash` 로 바꾸고
    # `review.similarity_floor` 를 채운다 (유사도에 의미는 없으니 큐에 잡음이 쌓인다).
    embedding:
      model: null

aggregate:
  # 로컬은 백엔드가 스키마를 만들기 전에도 돌려본다. 운영 기본은 base.yaml 의 true 다.
  service:
    required: false
  # [07] 의 문턱. **전부 잠정이다** — base.yaml 이 null 로 두어 운영에서 측정 없이 돌지
  # 못하게 하고, 로컬은 목록을 실제로 뽑아 보는 데 필요한 값을 여기 채운다. 확정은 뽑힌
  # 목록을 보고 base.yaml 로 옮기는 일이다 ([07 §6] "초기 규칙으로 먼저 내보내고, 실제
  # 목록을 보고 정한다").
  #
  # 근거는 2026-09-09 실데이터(fashion 371문서 · 원자료 28,433행 · 97일치)의 분포다.
  thresholds:
    rising:
      # 코퍼스가 하루 수십 건이라 절대 증가량이 크게 안 나온다. 3 이면 "하루 세 문서가
      # 더 다뤘다" 이고, 그보다 낮추면 1→2 가 급상승이 된다.
      min_growth_amount: 3
      # 50% — 증가량 조건과 함께 걸리므로 이 값만으로 잡음이 들어오지 않는다.
      min_growth_rate: 50
      # **가장 중요한 값이다** ([07 §6]). 5문서는 승격 관문(promote.min_documents)과 같은
      # 눈금이라, 승격될 만큼 관측된 키워드만 급상승에 오른다.
      min_mention_count: 5
    new:
      windows:
        # 규격이 준 값 그대로.
        "24H": {quiet_days: 7, quiet_max: 1, min_mentions: 5}
        # 24H 를 기간 비율로 늘린 잠정값. 조용함의 기준은 기간이 길어져도 낮게 둔다 —
        # `NEW` 는 "거의 없던 것" 이지 "적었던 것" 이 아니다.
        "7D": {quiet_days: 30, quiet_max: 2, min_mentions: 10}
        "30D": {quiet_days: 90, quiet_max: 3, min_mentions: 20}
    zscore:
      # 배경 90일. 원자료가 97일치라 지금 쓸 수 있는 거의 전부다.
      background_days: 90
      # 배경이 열흘도 안 되면 평균·표준편차가 표본 하나에 흔들린다. 그런 키워드는 z 를
      # 내지 않고 통과시킨다 — 갓 뜬 키워드를 무정보어로 몰지 않기 위해서다.
      min_background_days: 10
      # 2.0 = 배경 표준편차의 두 배. `요즘`·`매력` 처럼 늘 흔한 말은 여기서 걸린다.
      min_z: 2.0
