# JVM 쪽 로그. spark/scripts/submit.sh 가 -Dlog4j.configurationFile 로 물린다.
#
# 이 파일이 없으면 Spark 가 번들한 기본 설정이 INFO 로 찍는다. SparkContext 기동만으로
# 50줄이 넘게 나오고, 그 사이에 우리 로그가 묻힌다. 코드의 setLogLevel 은 컨텍스트가
# 뜬 뒤에야 걸리므로 기동 구간을 못 막는다. 그래서 파일로 준다.

rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yy/MM/dd HH:mm:ss} %-5p %c{1} - %m%n

# 기동 구간에서 특히 시끄러운 것들. warn 으로도 남는 줄이 있어 따로 내린다.
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = error
logger.hadoopconf.name = org.apache.hadoop.conf.Configuration
logger.hadoopconf.level = error
logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error

# 반대로, 이건 조용하면 안 된다 — 어디까지 읽었는지가 여기 남는다 ([01 §4]).
logger.streaming.name = org.apache.spark.sql.execution.streaming
logger.streaming.level = warn
