# 데이터 EC2 배포. Job 이 airflow 컨테이너 안에서 돌기 때문에 주소가 전부 서비스 이름이다.
# 컴포즈 네트워크 s15p21a102-data 로 minio 에 붙고, 앱 DB 는 pipeline 프로젝트의
# postgres 다. 호스트 포트를 열 필요가 없다.
#
# 실제 값은 spark/compose.spark.yaml 이 환경변수로 덮는다. 여기 적힌 것은 그 오버레이
# 없이 컨테이너 안에서 손으로 돌려볼 때의 기본값이다.
#
# EC2 호스트에서 .venv 로 직접 돌려볼 때는 이 프로파일이 아니라 `--profile local` 을 쓴다.
# 그쪽은 호스트에 열린 포트를 가리킨다 (datastore 가 127.0.0.1:29092 · :9000 을 연다).

logging:
  level: "INFO"
  spark_level: "WARN"

minio:
  endpoint: "http://minio:9000"

jdbc:
  # 컴포즈 안 postgres 의 trendin DB. 팀 postgres(forever102) 로 갈 때는 환경변수
  # APP_DB_URL 이 이 값을 덮는다 (compose.spark.yaml 의 SPARK_APP_DB_URL).
  url: "jdbc:postgresql://postgres:5432/trendin"
  user: "trendin"

# --- 임계값 ---------------------------------------------------------------
#
# **전부 잠정이다.** 목록을 실제로 뽑아 보려고 `local.yaml` 이 채워 둔 값을 그대로 옮겨 왔다
# (2026-09-15). `base.yaml` 은 이 키들을 계속 `null` 로 둔다 — 거기로 옮기는 것이 확정이고,
# 값이 여기 있는 동안은 아직 확정이 아니라는 표시다 ([10 §4] S6, [07 §6]).
#
# **여기 없는 키는 옮기지 않은 것이다.** `local.yaml` 의 `*.required: false` 는 선행 조건을
# 건너뛰는 로컬 전용 스위치라 두고 왔다 — 운영은 `base.yaml` 의 `true` 를 그대로 쓴다. 표가
# 없거나 UNIQUE 가 없으면 시작을 거부하는 쪽이 맞다.
#
# **⚠️ 코퍼스가 찬 뒤 다시 재야 한다.** 남은 두 값(`per_document_top_k` · `score_floor`)은
# 200건 표본에서 잰 것이고, 그 표본이 한국 매체 한국어뿐이다. 영어·일본어 소스가 붙으면
# 분포가 달라지므로 그때 다시 재서 `base.yaml` 로 옮긴다.
#
# 재는 방법이 2026-09-16 에 바뀌었다. 옛 가중치 스윕(`sweep-extract.py`)은 점수 축이
# 다섯에서 하나(모델 확률)로 줄면서 대상을 잃어 지웠다. 지금은 `pl_document_candidate` 의
# `score` 분포를 보고 상위 K 와 하한을 고른다.

extract:
  # **잠정이다.** base.yaml 이 이 둘을 null 로 두어 측정 없이 돌지 못하게 하고, 여기서
  # 채운다 ([10 §4] S6, [09 §7] 항목 5).
  #
  # 200건 표본·정답 20건에서 상위 K 를 10~25 로 훑었고 20 에서 F1 이 가장 높았다
  # (`scratchpad/kwlab/RESULTS.md` §1). 30 인 이유는 그 표본이 한국 매체 한국어뿐이고,
  # **승격에는 영향이 없기** 때문이다 — 언급량과 승격 심사는 필터를 통과한 전부를 세고
  # `selected` 를 보지 않는다 ([04 §7]). 이 값이 정하는 것은 `keyword_contents`(상세
  # 화면의 관련 콘텐츠)와 [06] 동시출현이다.
  per_document_top_k: 30
  # 모델 점수의 하한. 인식기 문턱(0.15)보다 높게 두어 두 단계로 거른다 — 문턱은 추론을
  # 다시 해야 바뀌지만 이 값은 재추출로 바뀐다.
  score_floor: 0.2
  # **배치를 기본값보다 낮춘다 — 데이터 EC2 는 메모리가 모자란다.**
  #
  # 2026-09-20 에 09-19 발행분을 추출하다 `Python worker exited unexpectedly (crashed)`
  # 로 두 번 죽었다. 컨테이너 `memory.events` 에 `oom_kill 2` 가 찍혔다. `SPARK_MASTER=
  # local[2]` 로 워커를 줄여도 같았다 — **워커 수가 아니라 한 배치의 피크가 넘었다.**
  # 2026-09-17 실측(워커당 RSS 2.3GB)은 36건짜리였고, 그 규모에서는 드러나지 않았다.
  #
  # `words` 2048 → 768 · `size` 32 → 8 로 낮추니 같은 구간이 끝났다 (문서 140 · 후보
  # 3,432 · 승격 2,472). 19분 걸렸다.
  #
  # **로컬은 그대로 둔다.** `base.yaml` 의 2048/32 로 4,945문서를 돌린 적이 있어, 이건
  # 알고리즘이 아니라 이 서버(4 CPU · 15GB)의 형편이다.
  recognizer:
    batch:
      words: 768
      size: 8
  registry:
    plural:
      df_dominance: 5
    abbreviation:
      min_documents: 3
    variant:
      min_length: 5
      max_edit_distance: 2
      df_dominance: 10
    promote:
      min_documents: 5
      min_observed_days: 2
      min_authors: 3
      min_representative_ratio: 0.6

aggregate:
  thresholds:
    rising:
      min_growth_amount: 3
      min_growth_rate: 50
      min_mention_count: 5
    new:
      # `quiet_days` 는 `base.yaml` 이 규격대로 정해 두었으므로 `null` 인 둘만 채운다.
      # 설정은 사전을 재귀로 합치므로 여기 안 적은 키는 그대로 남는다.
      windows:
        "7D": {quiet_max: 2, min_mentions: 10}
        "30D": {quiet_max: 3, min_mentions: 20}
    zscore:
      # 90일 배경. 이 값이 원자료를 며칠치 읽을지도 정한다 — 30D + 90 = 120일이 지평이다.
      background_days: 90
      min_background_days: 10
      min_z: 2.0
