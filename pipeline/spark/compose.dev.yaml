# 로컬 개발용 오버레이. pipeline/compose.yaml 위에 얹는다.
#
#   docker compose -f datastore/compose.yaml up -d          # 먼저 (Kafka · MinIO)
#   cd pipeline
#   docker compose -f compose.yaml -f spark/compose.dev.yaml up -d
#
# --- 이 파일과 compose.spark.yaml 의 차이 ------------------------------------
# 이것은 **호스트 .venv 에서 spark-submit 을 직접 칠 때**만 쓴다. 배포(데이터 EC2)에서는
# Job 이 airflow 컨테이너 안에서 돌기 때문에 spark/compose.spark.yaml 을 쓴다.
# 둘을 같이 얹지 않는다 — 같은 일을 두 경로로 하게 된다.
#
# compose.yaml 을 직접 고치지 않는 이유는 그 파일이 팀 공용 스켈레톤이라 다른 담당의
# 작업과 충돌하기 때문이다 (09 §2). 오버레이로 얹으면 각자 필요한 것만 켠다.
#
# --- 이 파일이 하는 일은 하나다 ---------------------------------------------
# Spark 는 컨테이너에 넣지 않는다 (09 §2). 호스트의 .venv 에서 local[*] 로 돈다.
# 그래서 붙어야 할 세 곳 중 두 곳은 이미 호스트에 열려 있는데 하나가 닫혀 있다:
#
#   Kafka     datastore/compose.yaml 이 EXTERNAL 리스너를 127.0.0.1:29092 로 연다  ✓
#   MinIO     datastore/compose.yaml 이 API 를 127.0.0.1:9000 으로 연다            ✓
#   PostgreSQL pipeline/compose.yaml 은 "호스트 포트는 열지 않는다"                 ✗
#
# 그 하나를 여는 것이 전부다. 열어두는 범위는 루프백으로 제한한다.
#
# --- Kafka · MinIO 를 여기서 다시 띄우지 않는 이유 ---------------------------
# 09 §2 를 쓸 당시에는 둘 다 없었지만, 지금은 datastore/compose.yaml 이 띄운다
# (S15P21A102-156 · 157). 같은 브로커를 두 프로젝트가 각자 띄우면 컨테이너가 둘이
# 되고 포트와 볼륨이 부딪힌다. pipeline/compose.yaml 이 이미 네트워크
# s15p21a102-data 를 external 로 참조하므로, 저장소를 먼저 띄우지 않으면 이 명령
# 자체가 뜨지 않는다. 순서가 강제돼 있다.

services:
  postgres:
    ports:
      # 호스트 기본 포트(5432)를 피한다. 개발 PC 에 PostgreSQL 이 깔려 있는 경우가 많다.
      # conf/local.yaml 의 jdbc.url 이 이 포트를 가리킨다. 바꾸면 둘 다 바꾼다.
      - "${APP_DB_BIND:-127.0.0.1}:${APP_DB_PORT:-55432}:5432"
