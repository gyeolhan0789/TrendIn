spring:
  application:
    name: trendin
  flyway:
    enabled: false
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

jwt:
  # 로컬 개발과 테스트에서만 쓰는 기본값이다. dev 프로필은 반드시 환경변수로 덮어쓴다.
  secret: ${JWT_SECRET:trendin-local-development-only-secret-do-not-use-in-production}
  access-token-expiration: 15m
  refresh-token-expiration: 14d

cors:
  # 프런트엔드 오리진. 환경마다 다르므로 프로필에서 덮어쓴다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  max-age: 1h

notification:
  trend-change:
    cron: ${TREND_NOTIFICATION_CRON:0 0 0 * * *}
    zone: Asia/Seoul

oauth:
  gitlab:
    # 사내 GitLab과 gitlab.com이 같은 엔드포인트 규약을 쓰므로 주소만 바꾸면 된다.
    base-url: ${GITLAB_OAUTH_BASE_URL:https://lab.ssafy.com}
    # 값이 없어도 애플리케이션은 뜬다. OAuth 로그인을 실제로 호출할 때만 실패한다.
    client-id: ${GITLAB_OAUTH_CLIENT_ID:}
    client-secret: ${GITLAB_OAUTH_CLIENT_SECRET:}
    # 제공자에 등록한 값과 정확히 같아야 한다. 다르면 토큰 교환이 거절된다.
    redirect-uri: ${GITLAB_OAUTH_REDIRECT_URI:http://localhost:5173/oauth/gitlab/callback}
