spring:
  application:
    name: trendin
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

jwt:
  # 로컬 개발과 테스트에서만 쓰는 기본값이다. dev 프로필은 반드시 환경변수로 덮어쓴다.
  secret: ${JWT_SECRET:trendin-local-development-only-secret-do-not-use-in-production}
  access-token-expiration: 15m
  refresh-token-expiration: 14d
