spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DEV_POSTGRES_URL}
    username: ${DEV_POSTGRES_USER_NAME}
    password: ${DEV_POSTGRES_PASSWORD}
    hikari:
      # 요청이 끊겨도 계속 실행될 수 있는 긴 SQL은 PostgreSQL에서 취소한다.
      connection-init-sql: SET statement_timeout = '30s'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${DEV_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}
      password: ${DEV_REDIS_PASSWORD}

jwt:
  secret: ${DEV_JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

cors:
  allowed-origins: ${DEV_CORS_ALLOWED_ORIGINS}
