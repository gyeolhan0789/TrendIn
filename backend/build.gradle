plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.4'
}

group = 'com.forever102'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	asciidoctorExt
}

asciidoctorj {
	version = '3.0.1'
}

ext {
	snippetsDir = layout.buildDirectory.dir('generated-snippets')
	jjwtVersion = '0.12.6'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'org.postgresql:postgresql'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testRuntimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	testRuntimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

	implementation 'org.springframework.boot:spring-boot-h2console'
	runtimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	outputs.dir snippetsDir
}

tasks.register('copyDocs', Copy) {
	dependsOn tasks.named('asciidoctor')
	from(tasks.named('asciidoctor').map { it.outputDir })
	into layout.projectDirectory.dir('src/main/resources/static/docs')
}

tasks.named('test') {
	useJUnitPlatform()
	outputs.dir snippetsDir
}

tasks.named('asciidoctor') {
	dependsOn tasks.named('test')
	configurations 'asciidoctorExt'
	sourceDir layout.projectDirectory.dir('docs/asciidoc')
	inputs.dir snippetsDir
	attributes 'snippets': snippetsDir.get().asFile
}

tasks.named('processResources') {
	// bootJar에 테스트로 생성한 최신 문서를 직접 포함한다.
	exclude 'static/docs/**'
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
	dependsOn tasks.named('asciidoctor')
	from(tasks.named('asciidoctor').map { it.outputDir }) {
		into 'BOOT-INF/classes/static/docs'
	}
}
