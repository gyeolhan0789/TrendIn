# TrendIn 수집 계층 저장소 — MinIO.
# 데이터 EC2(J15A102A) 에 뜬다. Airflow(pipeline/) 와 Spark(spark/) 가 여기에 붙는다.
# 계약(버킷·객체 경로)은 pipeline/docs/data-pipeline-design.md 4 장.
#
# **Kafka 는 걷혔다** (Kafka 제거 3/3). 수집은 MinIO 에 원문을 올리고 앱 DB 의 수집 이력에
# 적으며, Spark 는 그 이력의 뷰(`collected_article_event`)를 읽는다 — 브로커를 거치지
# 않는다. 이 파일에 브로커가 있던 시절의 근거는 Jira S15P21A102-156·157 에 남아 있다.
# 결정 근거: Jira S15P21A102-156 (실행 환경) · S15P21A102-158 (보관 정책)
name: s15p21a102-datastore

services:
  # 원문 객체 저장소. S3 호환 API 는 9000, 객체 브라우저 콘솔은 9001.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in datastore/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in datastore/.env}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # 버킷 · 정책 · 계정 생성. 크롤러 키는 raw-data 에 write, Spark 키는 raw-data 를 read 하고
  # curated 에 write 한다 (S15P21A102-243).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in datastore/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in datastore/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-data}
      # 정제 결과 버킷. pipeline/.env 의 TRENDIN_MINIO_CURATED_BUCKET 과 값이 같아야 한다.
      MINIO_CURATED_BUCKET: ${MINIO_CURATED_BUCKET:-curated}
      MINIO_CRAWLER_ACCESS_KEY: ${MINIO_CRAWLER_ACCESS_KEY:?Set MINIO_CRAWLER_ACCESS_KEY in datastore/.env}
      MINIO_CRAWLER_SECRET_KEY: ${MINIO_CRAWLER_SECRET_KEY:?Set MINIO_CRAWLER_SECRET_KEY in datastore/.env}
      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY:?Set MINIO_SPARK_ACCESS_KEY in datastore/.env}
      MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY:?Set MINIO_SPARK_SECRET_KEY in datastore/.env}
      # 수명 주기. 버킷 전체에 한 규칙이라 접두어를 보지 않는다 (S15P21A102-158).
      MINIO_RAW_EXPIRE_DAYS: ${MINIO_RAW_EXPIRE_DAYS:-90}
    volumes:
      - ./minio-init/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
    name: s15p21a102-minio-data

networks:
  # 이 프로젝트가 만든다. pipeline · spark 는 external 로 이 이름을 참조해
  # 서비스 이름 minio 로 붙는다.
  default:
    name: s15p21a102-data
