name: s15p21a102-infra

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in infra/.env}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEV_POSTGRES_URL: ${DEV_POSTGRES_URL:?Set DEV_POSTGRES_URL in infra/.env}
      DEV_POSTGRES_USER_NAME: ${DEV_POSTGRES_USER_NAME:?Set DEV_POSTGRES_USER_NAME in infra/.env}
      DEV_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      DEV_FLYWAY_BASELINE_ON_MIGRATE: ${DEV_FLYWAY_BASELINE_ON_MIGRATE:-false}
      DEV_REDIS_HOST: ${DEV_REDIS_HOST:?Set DEV_REDIS_HOST in infra/.env}
      DEV_REDIS_PORT: ${DEV_REDIS_PORT:?Set DEV_REDIS_PORT in infra/.env}
      DEV_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?Set DEV_JWT_SECRET in infra/.env}
      DEV_CORS_ALLOWED_ORIGINS: ${DEV_CORS_ALLOWED_ORIGINS:?Set DEV_CORS_ALLOWED_ORIGINS in infra/.env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Set BACKEND_PORT in infra/.env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shared

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forever102
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    # 기본값은 루프백이다. 데이터 EC2 의 파이프라인이 붙어야 할 때만 서버 .env 에서
    # POSTGRES_BIND_IP 를 그 호스트의 사설 IP 로 채운다. 0.0.0.0 으로 열지 않는다 —
    # 공인 인터페이스까지 열려 보안 그룹이 유일한 방어선이 된다.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared

  redis:
    image: redis:8-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}
    command:
      - sh
      - -c
      - exec redis-server /etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared

volumes:
  postgres_data:
    name: s15p21a102-postgres-data
  redis_data:
    name: s15p21a102-redis-data

networks:
  shared:
    name: s15p21a102-shared
    driver: bridge
