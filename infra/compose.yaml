name: s15p21a102-infra

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared
    # S15P21A102-73: credentials and loopback-only port publishing.
    # Deployment requires the credentials configuration from issue 73.

volumes:
  postgres_data:
    name: s15p21a102-postgres-data

networks:
  shared:
    name: s15p21a102-shared
    driver: bridge
