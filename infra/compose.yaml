name: s15p21a102-infra

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forever102
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared

volumes:
  postgres_data:
    name: s15p21a102-postgres-data

networks:
  shared:
    name: s15p21a102-shared
    driver: bridge
