# 공용 Redis 설정. 비밀번호는 이 파일에 두지 않고 compose의 --requirepass로 주입한다.
# 리프레시 토큰 저장 용도이므로 재시작 후에도 데이터가 유지되어야 한다.

# 데이터 디렉터리. named volume s15p21a102-redis-data가 연결되는 경로다.
dir /data

# AOF 영속화. 재시작·재생성 후 토큰을 복구하기 위해 사용한다.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB 스냅샷. AOF와 함께 두어 장애 시 복구 수단을 이중화한다.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# 비밀번호가 없는 접근을 차단한다. requirepass는 compose에서 주입한다.
protected-mode yes

# 메모리 상한. 토큰은 만료로 정리되므로 임의 축출(eviction)을 허용하지 않는다.
# 상한에 도달하면 쓰기가 실패한다. 로그인 실패로 이어지므로 사용량을 모니터링한다.
maxmemory 256mb
maxmemory-policy noeviction

# 만료 이벤트가 필요하면 아래를 켠다. 현재는 사용하지 않는다.
# notify-keyspace-events Ex

loglevel notice
