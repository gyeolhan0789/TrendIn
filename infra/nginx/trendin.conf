server {
    listen 80;
    listen [::]:80;
    server_name j15a102.p.ssafy.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trendin;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name j15a102.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j15a102.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a102.p.ssafy.io/privkey.pem;

    root /var/www/trendin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 매번 서버에 바뀌었는지 묻는다. 캐시 지시가 없으면 브라우저가 어림으로 한동안
    # 들고 있어, 배포 뒤에도 옛 번들을 가리키는 화면이 뜨고 새로고침해야 바뀌었다. 안 바뀌었으면
    # ETag 로 304 만 오가므로 늘어나는 건 왕복 한 번이다. SPA 경로의 /index.html 대체도 여기로 온다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 빌드 산출물은 이름에 내용 해시가 붙어 있어 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 는 JVM 내부 상태와 전체 URI 목록을 드러낸다. Prometheus 는 컨테이너
    # 네트워크로 직접 긁으므로 nginx 를 거칠 이유가 없다. ^~ 가 /api/ 보다 먼저 매칭된다.
    location ^~ /api/actuator {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        error_page 504 = @api_timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|domains|keywords|members)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        error_page 504 = @api_timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /trends/:id is both a SPA route and a legacy API route.
    location ~ ^/trends(/|$) {
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        error_page 504 = @api_timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_accept !~* "text/html") {
            proxy_pass http://127.0.0.1:8080;
        }
        try_files $uri $uri/ /index.html;
    }

    location @api_timeout {
        default_type application/json;
        return 504 '{"success":false,"message":"요청 처리 시간이 초과되었습니다."}';
    }
}
