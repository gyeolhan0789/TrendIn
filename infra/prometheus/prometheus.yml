global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: airflow
    static_configs:
      - targets:
          - pipeline-metrics:9102

  # Spring Boot actuator. shared 네트워크의 컨테이너 이름으로 직접 긁으므로 nginx 를 거치지 않는다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  # 부하테스트 대상. 운영과 같은 화면에서 job 라벨로 갈라 본다.
  # load-test/compose.loadtest.yaml 이 떠 있을 때만 응답하므로, 평소 targets 화면에는
  # down 으로 남는다. 그것이 정상이다.
  - job_name: backend-loadtest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend-loadtest:8080
